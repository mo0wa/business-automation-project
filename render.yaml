# Render Blueprint — 배포 파이프라인을 코드로 정의 (대시보드 설정을 git으로 공유)
# 참고: 협업/세팅 전체 가이드는 COLLABORATION.md
#
# ┌ 구성 ─────────────────────────────────────────────────────────────┐
# │ 웹 서비스 1개(Express) 가 API(/api/*) + React 빌드(frontend/dist) 서빙 │
# │ DB 는 Neon(PostgreSQL). 접속은 DATABASE_URL 하나로.                    │
# └───────────────────────────────────────────────────────────────────┘
#
# ⚠️ 팀원이 확인/채울 것:
#   1) 아래 buildCommand / startCommand 가 현재 Render 대시보드 값과 같은지 확인.
#      (다르면 대시보드 값을 이 파일에 맞추거나, 이 파일을 대시보드 값에 맞춰 수정)
#   2) DATABASE_URL 은 비밀값이라 여기 적지 않음(sync: false). Render 대시보드
#      → 이 서비스 → Environment 에서 직접 입력. (Neon 접속 문자열)
#
# 이 파일을 "실제 소스"로 삼으려면 Render 에서 New → Blueprint 로 이 저장소를 연결.
# (이미 수동 생성된 서비스는 이 파일을 무시하므로, 그냥 둬도 기존 배포에 영향 없음)

services:
  - type: web
    name: business-automation-project      # onrender.com 서브도메인과 동일해야 함
    runtime: node
    plan: free                             # 무료 플랜 (15분 미접속 시 잠듦 → keepalive 로 완화)
    region: singapore                      # ❓ 실제 리전과 다르면 수정 (예: oregon)
    branch: main                           # 이 브랜치에 push 시 자동 배포
    # backend/frontend 의존성 설치 후 프론트 빌드 → frontend/dist 생성(서버가 서빙)
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /health               # keepalive/무중단 확인용 엔드포인트
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                        # 비밀값 → git 에 저장 안 함. 대시보드에서 입력
      # PORT 는 Render 가 자동 주입하므로 지정하지 않음
